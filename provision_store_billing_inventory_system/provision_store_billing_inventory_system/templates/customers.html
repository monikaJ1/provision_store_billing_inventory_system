{% extends "base.html" %}{% block heading %}Customers{% endblock %}{% block content %}<div class="rowgrid"><section class="panel"><h3>Add customer</h3><form method="post"><label>Name</label><input class="form-control mb-2" name="name" required><label>Phone</label><input class="form-control mb-2" name="phone"><label>Email</label><input class="form-control mb-3" type="email" name="email"><button class="btn btn-primary">Save customer</button></form></section><section class="panel"><h3>Customer records</h3><p class="muted">Saved customers can be selected during billing.</p><div class="total">{{customers|length}}</div></section></div><div class="panel"><form class="d-flex gap-2 mb-3"><input class="form-control" name="q" value="{{q}}" placeholder="Search name or phone"><button class="btn btn-outline-secondary">Search</button></form><table class="table"><tr><th>Name</th><th>Phone</th><th>Email</th></tr>{% for c in customers %}<tr><td>{{c.name}}</td><td>{{c.phone}}</td><td>{{c.email}}</td></tr>{% endfor %}</table></div>{% endblock %}
